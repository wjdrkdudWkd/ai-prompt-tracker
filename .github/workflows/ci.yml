name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════════
      # Frontend Setup (Required for Option A - React in JAR)
      # ═══════════════════════════════════════════════════════════
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ═══════════════════════════════════════════════════════════
      # Build Frontend (React Dashboard)
      # ═══════════════════════════════════════════════════════════
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React dashboard
        run: |
          cd frontend
          npm run build
        env:
          NODE_ENV: production

      # ═══════════════════════════════════════════════════════════
      # Copy Frontend to Starter Resources
      # ═══════════════════════════════════════════════════════════
      - name: Copy frontend to starter
        run: ./gradlew :tracker-starter:copyFrontend --no-daemon --stacktrace

      # ═══════════════════════════════════════════════════════════
      # Build Backend (JAR with Embedded React)
      # ═══════════════════════════════════════════════════════════
      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon --stacktrace

      # ═══════════════════════════════════════════════════════════
      # Strict Verification (CI Requirement - MUST PASS)
      # ═══════════════════════════════════════════════════════════
      - name: Verify JAR contains React dashboard (STRICT)
        run: ./gradlew :tracker-starter:verifyJarContentsStrict --no-daemon --stacktrace

      # ═══════════════════════════════════════════════════════════
      # Upload Artifacts
      # ═══════════════════════════════════════════════════════════
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracker-starter-jar
          path: tracker-starter/build/libs/*.jar
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
