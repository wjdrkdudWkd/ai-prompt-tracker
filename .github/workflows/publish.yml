name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version detection

      # ═══════════════════════════════════════════════════════════
      # Frontend Setup (Required for Option A - React in JAR)
      # ═══════════════════════════════════════════════════════════
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ═══════════════════════════════════════════════════════════
      # Build Frontend (React Dashboard)
      # ═══════════════════════════════════════════════════════════
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
        env:
          NODE_ENV: production

      - name: Build React dashboard
        run: |
          cd frontend
          npm run build
        env:
          NODE_ENV: production

      # ═══════════════════════════════════════════════════════════
      # Copy Frontend to Starter Resources
      # ═══════════════════════════════════════════════════════════
      - name: Copy frontend to starter
        run: ./gradlew :tracker-starter:copyFrontend --no-daemon --stacktrace

      # ═══════════════════════════════════════════════════════════
      # Build Backend (JAR with Embedded React)
      # ═══════════════════════════════════════════════════════════
      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon --stacktrace

      # ═══════════════════════════════════════════════════════════
      # Strict Verification (CI Requirement - MUST PASS)
      # ═══════════════════════════════════════════════════════════
      - name: Verify JAR contains React dashboard (STRICT)
        run: ./gradlew :tracker-starter:verifyJarContentsStrict --no-daemon --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            tracker-starter/build/libs/*.jar
          retention-days: 1

  publish:
    name: Publish to GitHub Packages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version detection

      # ═══════════════════════════════════════════════════════════
      # Frontend Setup (Required for Option A - React in JAR)
      # ═══════════════════════════════════════════════════════════
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ═══════════════════════════════════════════════════════════
      # Build Frontend (React Dashboard)
      # ═══════════════════════════════════════════════════════════
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
        env:
          NODE_ENV: production

      - name: Build React dashboard
        run: |
          cd frontend
          npm run build
        env:
          NODE_ENV: production

      # ═══════════════════════════════════════════════════════════
      # Copy Frontend to Starter Resources
      # ═══════════════════════════════════════════════════════════
      - name: Copy frontend to starter
        run: ./gradlew :tracker-starter:copyFrontend --no-daemon --stacktrace

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag release: extract version from tag (v1.2.3 -> 1.2.3)
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Publishing RELEASE version: $VERSION"
          else
            # Main branch: compute snapshot version from latest tag
            LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*.*.*" 2>/dev/null || echo "v0.0.0")
            BASE_VERSION=${LATEST_TAG#v}
            VERSION="${BASE_VERSION}-SNAPSHOT"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Publishing SNAPSHOT version: $VERSION"
          fi

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :tracker-starter:publishMavenPublicationToGitHubPackagesRepository \
            -Pversion=${{ steps.version.outputs.version }} \
            --no-daemon \
            --stacktrace

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## AI Prompt Tracker Spring Boot Starter - v${{ steps.version.outputs.version }}

            ### Installation

            Add to your `build.gradle.kts`:

            ```kotlin
            repositories {
                maven {
                    url = uri("https://maven.pkg.github.com/wjdrkdudWkd/ai-prompt-tracker")
                    credentials {
                        username = project.findProperty("gpr.user") as String? ?: System.getenv("GITHUB_ACTOR")
                        password = project.findProperty("gpr.key") as String? ?: System.getenv("GITHUB_TOKEN")
                    }
                }
            }

            dependencies {
                implementation("com.galoong:ai-prompt-tracker-starter:${{ steps.version.outputs.version }}")
            }
            ```

            ### Changes

            See [CHANGELOG](https://github.com/wjdrkdudWkd/ai-prompt-tracker/compare/${{ github.event.before }}...${{ github.ref_name }}) for details.

            ### Documentation

            - [README](https://github.com/wjdrkdudWkd/ai-prompt-tracker/blob/main/README.md)
            - [Publishing Guide](https://github.com/wjdrkdudWkd/ai-prompt-tracker/blob/main/STARTER_PUBLISHING.md)
          generate_release_notes: true
          draft: false
          prerelease: false
