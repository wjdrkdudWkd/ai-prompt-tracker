spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

# Enable raw data storage in test
ai-prompts:
  tracking:
    store-raw-data: true

logging:
  level:
    com.galoong.aiprompttracker: DEBUG
