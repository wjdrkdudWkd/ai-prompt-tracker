spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

# Disable raw data storage in production (privacy & storage optimization)
ai-prompts:
  tracking:
    store-raw-data: false

logging:
  level:
    root: WARN
    com.galoong.aiprompttracker: INFO
    org.springframework.web: WARN

server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
