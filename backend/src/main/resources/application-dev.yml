spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# Enable raw data storage in development
ai-prompts:
  tracking:
    store-raw-data: true

logging:
  level:
    com.galoong.aiprompttracker: DEBUG
    org.springframework.web: DEBUG
