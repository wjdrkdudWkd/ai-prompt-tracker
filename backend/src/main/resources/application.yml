spring:
  application:
    name: ai-prompt-tracker

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_prompt_tracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
    elasticsearch:
      repositories:
        enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  security:
    user:
      name: admin
      password: admin123

# AI Prompt Tracker Configuration
ai-prompts:
  tracking:
    # Store raw request/response data (only in dev/test for debugging)
    store-raw-data: ${AI_PROMPTS_STORE_RAW:true}
    # Maximum bytes to capture from request body (16KB default)
    max-request-bytes: 16384
    # Maximum bytes to capture from response body (32KB default)
    max-response-bytes: 32768
    # Content types to capture (JSON only by default)
    capture-content-types:
      - application/json
    # Whether to capture calls to unknown providers
    capture-unknown-providers: false
    # Truncation suffix when content exceeds limits
    truncation-suffix: " ... (truncated)"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    # Disable Elasticsearch health check by default
    # Only enabled in 'advanced' profile
    elasticsearch:
      enabled: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.galoong.aiprompttracker: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Server Configuration
server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always
    include-stacktrace: on_param
