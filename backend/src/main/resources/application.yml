spring:
  application:
    name: ai-prompt-tracker-demo

  # H2 Console (for demo mode)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA - disable Hibernate DDL (use Flyway instead)
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # Flyway - enable migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# AI Prompt Tracker Configuration
ai-prompts:
  tracking:
    # Enable demo mode (H2 in-memory database with auto-migration)
    demo:
      enabled: true

    # Enable persistence in JDBC mode
    persistence:
      mode: jdbc

    # Enable Flyway migrations
    flyway:
      enabled: true
      auto-migrate: true

    # Enable body capture with SAFE mode (default)
    capture-enabled: true
    capture-mode: SAFE
    store-raw-data: true

    # Capture limits
    max-request-bytes: 16384
    max-response-bytes: 32768

    # Content types to capture
    capture-content-types:
      - application/json

    # Capture unknown providers for demo purposes
    capture-unknown-providers: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    root: INFO
    com.galoong.aiprompttracker: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
