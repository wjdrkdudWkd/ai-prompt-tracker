# Gradle JVM settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

# Version Management
# ------------------
# Version is managed dynamically:
# - Local development: defaults to "dev-SNAPSHOT" (see build.gradle.kts)
# - CI/CD: GitHub Actions passes version via -Pversion=X.Y.Z
# - Manual override: uncomment and set version below for local testing
#
# Examples:
#   version=1.0.0           # Release version
#   version=1.0.0-SNAPSHOT  # Snapshot version
#   version=1.0.0-RC1       # Release candidate
#
# Leave commented for normal development (uses dev-SNAPSHOT)
# version=
